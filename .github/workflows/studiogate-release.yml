name: Release StudioGate desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "studiogate-v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: studiogate-linux
          path: studio-access/release/*.AppImage

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: studio-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: studiogate-mac
          path: |
            studio-access/release/*.dmg
            studio-access/release/*.zip

  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: studiogate-win
          path: studio-access/release/*.exe

  publish-release:
    needs: [build-linux, build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: StudioGate ${{ github.ref_name }}
          files: |
            artifacts/studiogate-linux/*
            artifacts/studiogate-mac/*
            artifacts/studiogate-win/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
