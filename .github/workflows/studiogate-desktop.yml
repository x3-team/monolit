name: Build StudioGate desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "studio-access/desktop/**"
      - "studio-access/package.json"
      - "studio-access/package-lock.json"

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: studio-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: studiogate-mac
          path: |
            studio-access/release/*.dmg
            studio-access/release/*.zip

  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: studiogate-win
          path: studio-access/release/*.{exe,zip}
