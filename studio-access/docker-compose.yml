services:
  studiogate:
    build: .
    # Только localhost — снаружи ходит Nginx/HTTPS на поддомене
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/studiogate.db
      JWT_SECRET: ${JWT_SECRET:-change-me-now}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret-32bytes!!}
      APP_URL: ${APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    volumes:
      - studiogate_data:/data
    restart: unless-stopped

volumes:
  studiogate_data:
